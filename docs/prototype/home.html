<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - AI画作广场</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0052d9',
                        'primary-light': '#ecf2fe',
                        'td-gray': {
                            100: '#f3f3f3',
                            200: '#eeeeee',
                            300: '#e7e7e7',
                            400: '#dcdcdc',
                            500: '#c5c5c5',
                            600: '#a6a6a6',
                            700: '#8b8b8b',
                            800: '#777777',
                            900: '#5e5e5e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .safe-area-top {
            height: 54px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .masonry {
            column-count: 2;
            column-gap: 8px;
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 8px;
        }
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 83px;
            background: #fff;
            border-top: 1px solid #e7e7e7;
            padding-bottom: 34px;
        }
        .fab-button {
            position: fixed;
            right: 16px;
            bottom: 100px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .fab-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }
        .content-area {
            padding-bottom: 100px;
        }
    </style>
</head>
<body>
    <!-- 安全区域 + 顶部栏 -->
    <div class="safe-area-top flex items-end justify-center pb-2">
        <h1 class="text-white text-lg font-semibold">AI画画</h1>
    </div>

    <!-- 内容区域 -->
    <div class="content-area p-2">
        <!-- 瀑布流画作列表 -->
        <div class="masonry">
            <!-- 卡片1 -->
            <div class="masonry-item">
                <div class="bg-white rounded-xl overflow-hidden shadow-sm">
                    <img src="https://picsum.photos/300/400?random=1" alt="AI画作" class="w-full object-cover" style="height: 180px;">
                    <div class="p-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-gradient-to-r from-purple-400 to-pink-400"></div>
                                <span class="text-xs text-td-gray-700">小明</span>
                            </div>
                            <div class="flex items-center gap-1 text-td-gray-600">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
                                </svg>
                                <span class="text-xs">128</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 卡片2 -->
            <div class="masonry-item">
                <div class="bg-white rounded-xl overflow-hidden shadow-sm">
                    <img src="https://picsum.photos/300/350?random=2" alt="AI画作" class="w-full object-cover" style="height: 220px;">
                    <div class="p-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-gradient-to-r from-blue-400 to-cyan-400"></div>
                                <span class="text-xs text-td-gray-700">艺术家</span>
                            </div>
                            <div class="flex items-center gap-1 text-td-gray-600">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
                                </svg>
                                <span class="text-xs">256</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 卡片3 -->
            <div class="masonry-item">
                <div class="bg-white rounded-xl overflow-hidden shadow-sm">
                    <img src="https://picsum.photos/300/280?random=3" alt="AI画作" class="w-full object-cover" style="height: 160px;">
                    <div class="p-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-gradient-to-r from-green-400 to-teal-400"></div>
                                <span class="text-xs text-td-gray-700">创意达人</span>
                            </div>
                            <div class="flex items-center gap-1 text-td-gray-600">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
                                </svg>
                                <span class="text-xs">89</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 卡片4 -->
            <div class="masonry-item">
                <div class="bg-white rounded-xl overflow-hidden shadow-sm">
                    <img src="https://picsum.photos/300/320?random=4" alt="AI画作" class="w-full object-cover" style="height: 200px;">
                    <div class="p-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-gradient-to-r from-orange-400 to-red-400"></div>
                                <span class="text-xs text-td-gray-700">画画爱好者</span>
                            </div>
                            <div class="flex items-center gap-1 text-td-gray-600">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
                                </svg>
                                <span class="text-xs">312</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 卡片5 -->
            <div class="masonry-item">
                <div class="bg-white rounded-xl overflow-hidden shadow-sm">
                    <img src="https://picsum.photos/300/380?random=5" alt="AI画作" class="w-full object-cover" style="height: 240px;">
                    <div class="p-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-gradient-to-r from-indigo-400 to-purple-400"></div>
                                <span class="text-xs text-td-gray-700">梦想家</span>
                            </div>
                            <div class="flex items-center gap-1 text-td-gray-600">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
                                </svg>
                                <span class="text-xs">567</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 卡片6 -->
            <div class="masonry-item">
                <div class="bg-white rounded-xl overflow-hidden shadow-sm">
                    <img src="https://picsum.photos/300/300?random=6" alt="AI画作" class="w-full object-cover" style="height: 180px;">
                    <div class="p-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-gradient-to-r from-pink-400 to-rose-400"></div>
                                <span class="text-xs text-td-gray-700">设计师小王</span>
                            </div>
                            <div class="flex items-center gap-1 text-td-gray-600">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
                                </svg>
                                <span class="text-xs">198</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 悬浮按钮 -->
    <div class="fab-button">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
    </div>

    <!-- 底部Tab栏 -->
    <div class="tab-bar flex items-start justify-around pt-2">
        <div class="flex flex-col items-center gap-1">
            <svg class="w-6 h-6 text-primary" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span class="text-xs text-primary font-medium">首页</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <svg class="w-6 h-6 text-td-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="text-xs text-td-gray-600">我的</span>
        </div>
    </div>
</body>
</html>
