<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0052d9',
                        'primary-light': '#ecf2fe',
                        'td-gray': {
                            100: '#f3f3f3',
                            200: '#eeeeee',
                            300: '#e7e7e7',
                            400: '#dcdcdc',
                            500: '#c5c5c5',
                            600: '#a6a6a6',
                            700: '#8b8b8b',
                            800: '#777777',
                            900: '#5e5e5e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .safe-area-top {
            height: 54px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 83px;
            background: #fff;
            border-top: 1px solid #e7e7e7;
            padding-bottom: 34px;
        }
        .content-area {
            padding-bottom: 100px;
        }
        .wechat-login-btn {
            background: #07c160;
            transition: all 0.3s ease;
        }
        .wechat-login-btn:hover {
            background: #06ad56;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .gallery-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 4px;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
        .user-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <!-- 安全区域 + 顶部栏 -->
    <div class="safe-area-top flex items-end justify-center pb-2">
        <h1 class="text-white text-lg font-semibold">我的</h1>
    </div>

    <!-- 内容区域 -->
    <div class="content-area">
        <!-- 用户信息区 - 已登录状态 -->
        <div class="bg-white p-6 mb-3">
            <div class="flex items-center gap-4">
                <!-- 头像 -->
                <div class="w-16 h-16 rounded-full user-avatar flex items-center justify-center text-white text-2xl font-bold shadow-lg">
                    李
                </div>
                <!-- 用户信息 -->
                <div class="flex-1">
                    <h2 class="text-lg font-semibold text-td-gray-900">李小明</h2>
                    <p class="text-sm text-td-gray-600 mt-1">已创作 12 幅作品</p>
                </div>
                <!-- 设置图标 -->
                <button class="p-2 text-td-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 未登录状态（隐藏，用于展示） -->
        <div class="bg-white p-6 mb-3 hidden">
            <div class="flex flex-col items-center py-4">
                <div class="w-20 h-20 rounded-full bg-td-gray-200 flex items-center justify-center mb-4">
                    <svg class="w-10 h-10 text-td-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <p class="text-td-gray-600 text-sm mb-4">登录后查看你的作品</p>
                <button class="wechat-login-btn flex items-center gap-2 px-6 py-3 rounded-xl text-white font-medium">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178A1.17 1.17 0 014.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178 1.17 1.17 0 01-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 01.598.082l1.584.926a.272.272 0 00.14.045c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 01-.023-.156.49.49 0 01.201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.269-.03-.406-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.969-.982z"/>
                    </svg>
                    微信一键登录
                </button>
            </div>
        </div>

        <!-- 个人画廊 -->
        <div class="bg-white p-4">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-semibold text-td-gray-900">个人画廊</h3>
                <span class="text-sm text-td-gray-600">共 12 幅</span>
            </div>
            
            <!-- 画作网格 -->
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=20" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=21" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=22" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=23" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=24" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=25" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=26" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=27" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=28" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=29" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=30" alt="我的画作">
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/200/200?random=31" alt="我的画作">
                </div>
            </div>
        </div>
    </div>

    <!-- 底部Tab栏 -->
    <div class="tab-bar flex items-start justify-around pt-2">
        <div class="flex flex-col items-center gap-1">
            <svg class="w-6 h-6 text-td-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span class="text-xs text-td-gray-600">首页</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <svg class="w-6 h-6 text-primary" fill="currentColor" viewBox="0 0 24 24">
                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="text-xs text-primary font-medium">我的</span>
        </div>
    </div>
</body>
</html>
